.card img{width:100%;height:110px;object-fit:cover;background:#111}

<div class="ad-box">
<script>
  atOptions = {
    'key' : '66361e7bf85b4cff423e3cf0f595da50',
    'format' : 'iframe',
    'height' : 50,

  };

</div>

<script>
const SECRET="iraq2026_secret";
async function load(){
  try{
    const res = await fetch(`/api/channels?token=${SECRET}`);
    const text = await res.text();
    const lines = text.split('\n');
    let html='';
    for(let i=0;i<lines.length;i++){
      let l=lines[i].trim();
      if(l.startsWith('#EXTINF')){
        let name = l.split(',').pop().trim();
        let logoMatch = l.match(/tvg-logo="([^"]+)"/);
        let logo = logoMatch ? logoMatch[1] : "https://i.imgur.com/8Km9tLL.png";
        let url = lines[i+1]?.trim();
        if(url && url.startsWith('http')){
          let protectedUrl = `/stream?url=${encodeURIComponent(url)}&token=${SECRET}`;
          html+=`<div class="card" onclick="playVideo('${protectedUrl}')">
            <img src="${logo}" onerror="this.src='https://i.imgur.com/8Km9tLL.png'">
            <div class="t">${name}</div>
          </div>`;
        }
      }
    }
    document.getElementById('list').innerHTML = html || "القائمة فارغة - تأكد من channels.m3u";
  }catch(e){
    document.getElementById('list').innerHTML = "خطأ: "+e.message;
  }
}
function playVideo(url){
  const v=document.getElementById('player');
  v.src=url;
  v.load();
  v.play().catch(()=>{});
  window.scrollTo(0,0);
}
load();
</script>
